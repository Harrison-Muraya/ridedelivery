name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.13.2

      - name: Ruff check (tests)
        run: ruff check tests --output-format=github

      # Existing src/ has pre-existing style debt; keep this advisory until cleaned up.
      - name: Ruff check (src, advisory)
        continue-on-error: true
        run: ruff check src --output-format=github

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ridedelivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-ci-cd-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ridedelivery_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/ridedelivery_test
      APP_ENV: test
      DEBUG: "false"
      MPESA_CONSUMER_KEY: ""
      MPESA_CONSUMER_SECRET: ""
      MPESA_PASSKEY: test-passkey
      MPESA_SHORTCODE: "174379"
      MPESA_ENV: sandbox
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=term-missing

      - name: Run API / integration tests
        run: pytest tests/api -v --cov=src --cov-append --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
