x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ridedelivery}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridedelivery}
  DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-ridedelivery}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridedelivery}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  APP_ENV: production
  DEBUG: "false"

x-app: &app
  image: ${APP_IMAGE:-ridedelivery:local}
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    <<: *app-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridedelivery}
      POSTGRES_USER: ${POSTGRES_USER:-ridedelivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ridedelivery} -d ${POSTGRES_DB:-ridedelivery}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    <<: *app
    command: ["/bin/sh", "/app/deploy/entrypoint.sh"]
    ports:
      - "127.0.0.1:8000:8000"

  worker-rides:
    <<: *app
    command: celery -A src.jobs.celery_app worker -Q rides -c 4 --loglevel=info

  worker-notifications:
    <<: *app
    command: celery -A src.jobs.celery_app worker -Q notifications -c 4 --loglevel=info

  worker-payments:
    <<: *app
    command: celery -A src.jobs.celery_app worker -Q payments -c 2 --loglevel=info

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
