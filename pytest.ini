[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Keep fixture + test loops aligned so the session-scoped async engine
# is not reused across different event loops (asyncpg RuntimeError).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests that need PostgreSQL
